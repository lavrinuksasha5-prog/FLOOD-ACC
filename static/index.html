<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flood Checker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #fff); padding: 16px; margin: 0; }
  textarea { width: 100%; height: 80px; background: #232e3c; color: #fff; border: 1px solid #2a3a4a; border-radius: 8px; padding: 8px; box-sizing: border-box; margin-bottom: 8px; font-size: 12px; }
  button { width: 100%; padding: 12px; border: none; color: #fff; border-radius: 8px; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  .btn-upload { background: #2ea6ff; }
  .btn-valid { background: #ff9f0a; }
  .btn-flood { background: #4cd964; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 11px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #2a3a4a; text-align: left; }
  .flood { color: #ff6b6b; font-weight: bold; } 
  .ok { color: #4cd964; font-weight: bold; } 
  .dead { color: #888; } 
  .skip { color: #ff9f0a; }
  .checking { color: #ff9f0a; font-style: italic; }
</style>
</head>
<body>
  <h3>1. Прокси</h3>
  <textarea id="proxies" placeholder="host:port:user:pass"></textarea>
  <button class="btn-upload" onclick="uploadProxies()">Загрузить прокси</button>

  <h3>2. Сессии</h3>
  <input type="file" id="zipFile" accept=".zip" style="margin-bottom: 8px; color: #fff;">
  <button class="btn-upload" onclick="uploadSessions()">Загрузить ZIP</button>
  <div id="sessionStatus" style="margin-bottom: 8px; font-size: 12px;"></div>

  <h3>3. База юзернеймов</h3>
  <textarea id="usernames" placeholder="username1&#10;username2"></textarea>
  <button class="btn-upload" onclick="uploadUsernames()">Загрузить базу</button>
  <div id="usernameStatus" style="margin-bottom: 8px; font-size: 12px;"></div>

  <h3>4. Проверка</h3>
  <button class="btn-valid" onclick="runCheck('valid')">Проверить валидность</button>
  <button class="btn-flood" onclick="runCheck('flood')">Проверить на антифлуд</button>
  
  <div id="status" style="font-size: 12px; margin-bottom: 8px; color: #ff9f0a;"></div>

  <table id="table">
    <thead><tr><th>Имя</th><th>Тел</th><th>Стр</th><th>Статус</th><th>Ждать</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
let pollInterval = null;

async function uploadProxies() {
  const text = document.getElementById("proxies").value;
  const formData = new FormData();
  formData.append("proxies", text);
  await fetch("/upload/proxies", { method: "POST", body: formData });
  alert("Прокси загружены!");
}

async function uploadSessions() {
  const fileInput = document.getElementById("zipFile");
  if (!fileInput.files.length) return alert("Выбери ZIP файл");
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  document.getElementById("sessionStatus").innerText = "Загрузка...";
  const res = await fetch("/upload/sessions", { method: "POST", body: formData });
  const data = await res.json();
  document.getElementById("sessionStatus").innerText = `Найдено: ${data.sessions} сессий.`;
}

async function uploadUsernames() {
  const text = document.getElementById("usernames").value;
  const formData = new FormData();
  formData.append("usernames", text);
  await fetch("/upload/usernames", { method: "POST", body: formData });
  document.getElementById("usernameStatus").innerText = "База загружена!";
}

async function runCheck(mode) {
  const statusEl = document.getElementById("status");
  statusEl.innerText = mode === 'valid' ? "Проверяю валидность..." : "Проверяю на флуд...";
  const res = await fetch(`/check?mode=${mode}`);
  const data = await res.json();
  
  if (data.status === "started") {
    if (!pollInterval) pollInterval = setInterval(loadResults, 2000);
  } else if (data.status === "busy") {
    statusEl.innerText = "Уже идёт проверка. Подожди.";
  }
}

async function loadResults() {
  const res = await fetch("/results");
  const data = await res.json();
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";
  
  data.results.forEach(r => {
    const tr = document.createElement("tr");
    let cls = "ok";
    if (r.status === "Проверяю...") cls = "checking";
    else if (r.status.includes("FLOOD")) cls = "flood";
    else if (r.status === "DEAD" || r.status === "ERROR") cls = "dead";
    else if (r.status === "SKIP") cls = "skip";
    
    // Если статус "Проверяю", выводим прогресс из note в колонку "Ждать"
    let waitText = r.wait_seconds ? r.wait_seconds + "с" : "—";
    if (r.status === "Проверяю..." || r.status === "OK" || r.status === "DEAD" || r.status === "ERROR" || r.status === "SKIP") {
       waitText = r.note || "—";
    }

    tr.innerHTML = `<td>${r.name}</td><td>${r.phone}</td><td>${r.country}</td>
      <td class="${cls}">${r.status}</td><td>${waitText}</td>`;
    tbody.appendChild(tr);
  });

  if (!data.running) {
    document.getElementById("status").innerText = `Готово. Проверено: ${data.results.length}`;
    clearInterval(pollInterval);
    pollInterval = null;
  } else {
    document.getElementById("status").innerText = `Проверяю... Уже в базе: ${data.results.length}`;
  }
}

loadResults();
</script>
</body>
</html>
